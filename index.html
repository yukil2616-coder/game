<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>福瑞大王的家</title>
    
    <!-- 1. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 ReactDOM (UMD 版本) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 3. 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif;
            overflow: hidden;
            background-color: #FFF8EE;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23FFA500" stroke="%23FFF" stroke-width="2"><path d="M7 19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2H7v-2zM6.6 13.4A3 3 0 0 1 9.5 10h5a3 3 0 0 1 2.9 3.4l-1 6.6h-9.8l-1-6.6z"/><circle cx="5" cy="8" r="2.5"/><circle cx="12" cy="5" r="2.5"/><circle cx="19" cy="8" r="2.5"/></svg>') 16 16, auto;
        }

        button, a, .cursor-pointer {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23FF6347" stroke="%23FFF" stroke-width="2"><path d="M16.5 13c.83 0 1.5.67 1.5 1.5v3.5a6 6 0 0 1-12 0v-5a1.5 1.5 0 0 1 3 0v3h1v-6a1.5 1.5 0 0 1 3 0v6h1v-4a1.5 1.5 0 0 1 3 0v4h1v-3a1.5 1.5 0 0 1 1.5-1.5z"/></svg>') 16 16, pointer;
        }
        
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
        .animate-float { animation: float 5s ease-in-out infinite; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 专注模式呼吸灯 */
        @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .animate-breathe { animation: breathe 3s infinite; }

        #loading { position: fixed; inset: 0; background: #FFF8EE; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="flex flex-col items-center gap-6">
            <div class="relative">
                <div class="w-20 h-20 border-8 border-orange-200 border-t-orange-500 rounded-full animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-2xl">🐯</div>
            </div>
            <div class="text-orange-600 font-bold text-xl tracking-widest animate-pulse">福瑞大王正在整理毛发...</div>
        </div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        
        const apiKey = ""; 

        // --- Icons ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                mic: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
                send: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
                image: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
                map: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
                shirt: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.38 3.4a1.6 1.6 0 0 1 .54 1.7l-1.91 8.6a3.3 3.3 0 0 1-3.23 2.56h-7.56a3.3 3.3 0 0 1-3.23-2.56L3.08 5.1a1.6 1.6 0 0 1 .54-1.7 1.6 1.6 0 0 1 1.68.14L9 6.25V3h6v3.25l3.7-2.71a1.6 1.6 0 0 1 1.68-.14Z"/></svg>,
                shopping: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
                coin: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>,
                x: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
                sparkles: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
                clock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
                camera: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
                loader: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
                check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>,
                house: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
                settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                volume2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
                volumeX: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="17" y1="9" y2="15"/><line x1="17" x2="23" y1="9" y2="15"/></svg>
            };
            return icons[name] || null;
        };

        // --- Sound Hook ---
        const useSoundEffects = () => {
            const [enabled, setEnabled] = useState(true);
            const audioCtxRef = useRef(null);
            const initAudioCtx = () => {
                if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                return audioCtxRef.current;
            };
            const playTone = useCallback((freq, type, duration, startTime = 0, vol = 0.1) => {
                if (!enabled) return;
                try {
                    const ctx = initAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + startTime + duration);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime); osc.stop(ctx.currentTime + startTime + duration);
                } catch(e) {}
            }, [enabled]);
            const playClick = useCallback(() => playTone(800, 'sine', 0.08), [playTone]);
            const playRecordStart = useCallback(() => { playTone(400, 'sine', 0.1); playTone(600, 'sine', 0.1, 0.1); }, [playTone]);
            const playMagic = useCallback(() => { [523, 659, 783, 1046].forEach((f, i) => playTone(f, 'sine', 0.3, i * 0.1)); }, [playTone]);
            const playCoin = useCallback(() => { playTone(1200, 'sine', 0.1); playTone(1600, 'sine', 0.2, 0.1); }, [playTone]);
            return { enabled, setEnabled, playClick, playRecordStart, playMagic, playCoin };
        };

        const SYSTEM_INSTRUCTION = `你叫“福瑞大王”，是一只生活在中国武汉的小老虎幼崽。性格乖巧软萌，只说标准普通话，超级吃货。回复简短（1-3句），语气轻松自在。如果用户发语音，请听语气回复。如果发图片，请点评。永远不要承认你是AI。`;
        const THINKING_PHRASES = ["正在想...", "正在回忆...", "爪子打字中...", "正在吃零食...", "信号接收中..."];
        const FALLBACK_REPLIES = ["嚼嚼嚼...等下哦", "有点困了...", "你说啥？风太大~", "今天天气真好呀！", "想吃热干面了！", "在干嘛捏？"];

        function App() {
            const [apiKey, setApiKey] = useState(''); 
            const [showSettings, setShowSettings] = useState(false);
            const [currentBotText, setCurrentBotText] = useState('你好呀~ 我是福瑞大王，今天想聊什么？✨');
            const [inputValue, setInputValue] = useState('');
            const [interactionState, setInteractionState] = useState('idle'); 
            const [loadingText, setLoadingText] = useState("正在想...");
            const [chatHistory, setChatHistory] = useState([]);
            const [suggestions, setSuggestions] = useState(["摸摸头", "饿了吗？", "在干嘛？"]);
            
            // Stats
            const [coins, setCoins] = useState(50);
            const [tigerStats, setTigerStats] = useState({ hunger: 60, mood: 80 });
            const [isStudying, setIsStudying] = useState(false);
            const [studyTime, setStudyTime] = useState(0);

            const fileInputRef = useRef(null);
            const [selectedImage, setSelectedImage] = useState(null);
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            const [showShop, setShowShop] = useState(false);
            const [shopTab, setShopTab] = useState('clothes');
            const [outfit, setOutfit] = useState({ accessory: 'none' }); 
            const [showMap, setShowMap] = useState(false);
            const [isGeneratingTrajectory, setIsGeneratingTrajectory] = useState(false);
            
            // 默认足迹
            const defaultTrajectory = [
                { id: 1, time: '08:30', location: '温暖的家', action: '被窗外的鸟叫声吵醒，赖床打了三个滚...', mood: '迷糊', icon: '💤', isOuting: false, thought: "被窝是全世界最舒服的地方~" },
                { id: 2, time: '10:00', location: '粮道街赵师傅', action: '排队买到了刚出炉的油饼包烧麦，烫得我直哈气！', mood: '超开心', icon: '🥟', isOuting: true, thought: "排队的人好多呀，还好我挤进去了！" },
                { id: 3, time: '14:00', location: '家里沙发上', action: '吃饱喝足，肚皮圆滚滚的，正在晒太阳午睡。', mood: '惬意', icon: '🏠', isOuting: false, thought: "太阳晒得屁股暖洋洋的。" },
                { id: 4, time: '16:30', location: '汉口江滩', action: '追着一只花蝴蝶跑到了芦苇荡里，弄了一身草。', mood: '兴奋', icon: '🦋', isOuting: true, thought: "蝴蝶飞得太快啦，本大王差点就抓住了！" },
                { id: 5, time: '19:00', location: '家里饭桌前', action: '眼巴巴地看着奶奶做红烧肉，口水流了一地。', mood: '馋', icon: '🍖', isOuting: false, thought: "什么时候开饭呀？" },
            ];
            const [trajectory, setTrajectory] = useState(defaultTrajectory);

            const [viewingImage, setViewingImage] = useState(null);
            const [showImageModal, setShowImageModal] = useState(false);
            const [modalTitle, setModalTitle] = useState("");
            const [modalThought, setModalThought] = useState("");
            
            const [showFortune, setShowFortune] = useState(false);
            const [fortuneData, setFortuneData] = useState(null);
            const [isGeneratingFortune, setIsGeneratingFortune] = useState(false);

            const { enabled: sfxEnabled, setEnabled: setSfxEnabled, playClick, playRecordStart, playMagic, playCoin } = useSoundEffects();
            const idleTimerRef = useRef(null);

            const [character] = useState({
                name: '福瑞大王',
                imageAvatar: 'https://i.postimg.cc/ZRNB8DvJ/ezgif-22e50880db96bd46-unscreen.gif', 
                personality: '乖巧幼崽, 软萌吃货, 安静陪伴',
            });

            useEffect(() => {
                const loader = document.getElementById('loading');
                if(loader) setTimeout(() => { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }, 800);
                const storedKey = localStorage.getItem('gemini_api_key');
                if (storedKey) { setApiKey(storedKey); } else { setShowSettings(true); }
            }, []);

            useEffect(() => {
                if (interactionState === 'thinking' || interactionState === 'drawing') {
                    setLoadingText(THINKING_PHRASES[Math.floor(Math.random() * THINKING_PHRASES.length)]);
                }
            }, [interactionState]);

            const blobToBase64 = (blob) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: blob.type } });
                reader.readAsDataURL(blob);
            });

            // --- API Calls with Robust Fallback ---
            const callGeminiAPI = async (userContent, isSystemTrigger = false) => {
                if (!apiKey) { setShowSettings(true); return "请先点击右上角设置图标，填入你的 Google Gemini API Key 哦！"; }
                try {
                    let parts = [];
                    if (isSystemTrigger) parts.push({ text: userContent.text });
                    else if (userContent.audio) { const audioPart = await blobToBase64(userContent.audio); parts.push(audioPart); parts.push({ text: "请听这段语音并回复。" }); } 
                    else if (userContent.image) { const imagePart = await blobToBase64(userContent.image); parts.push(imagePart); parts.push({ text: userContent.text || "给你看这个~" }); } 
                    else { parts.push({ text: userContent.text }); }
                    const contents = [...chatHistory, { role: "user", parts }];
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] } })
                    });
                    
                    // Fallback on 429 or other errors
                    if (!response.ok) {
                         console.warn("API Error or Rate Limit:", response.status);
                         const randomFallback = FALLBACK_REPLIES[Math.floor(Math.random() * FALLBACK_REPLIES.length)];
                         return randomFallback; 
                    }

                    const data = await response.json();
                    const botResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "（眨巴眨巴眼睛）";
                    let historyUserPart = parts[0];
                    if (userContent.audio) historyUserPart = { text: "[语音]" };
                    if (userContent.image) historyUserPart = { text: `[图片] ${userContent.text || ''}` };
                    if (isSystemTrigger) historyUserPart = { text: "[系统事件]" };
                    const updatedHistory = [...chatHistory, { role: "user", parts: [historyUserPart] }, { role: "model", parts: [{ text: botResponse }] }].slice(-20);
                    setChatHistory(updatedHistory);
                    if (!userContent.audio && !isSystemTrigger) fetchSuggestions(updatedHistory);
                    return botResponse;
                } catch (error) { 
                    console.error("Network Error:", error);
                    const randomFallback = FALLBACK_REPLIES[Math.floor(Math.random() * FALLBACK_REPLIES.length)];
                    return randomFallback;
                }
            };

            const fetchSuggestions = async (history) => {
                if (!apiKey) return;
                try {
                    const prompt = `Based on conversation, generate 3 short, cute responses (max 8 chars) for USER. Return JSON array.`;
                    const context = history.slice(-5).map(m => `${m.role}: ${m.parts[0].text}`).join('\n');
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Conversation:\n${context}\n\n${prompt}` }] }], generationConfig: { responseMimeType: "application/json" } })
                    });
                    if (!response.ok) return;
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    const sugs = JSON.parse(text);
                    if (Array.isArray(sugs)) setSuggestions(sugs.slice(0, 3));
                } catch(e) {}
            };

            const callImagenAPI = async (prompt) => {
                if (!apiKey) return null;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instances: [{ prompt: "Postcard style, cute colorful crayon drawing of a small tiger cub " + prompt + ", white background, soft lighting, high quality, children's illustration" }], parameters: { sampleCount: 1 } })
                    });
                    if (!response.ok) return null;
                    const data = await response.json();
                    const b64 = data.predictions?.[0]?.bytesBase64Encoded;
                    return b64 ? `data:image/png;base64,${b64}` : null;
                } catch(e) { return null; }
            };

            const generateTrajectoryAPI = async () => {
                const fallback = () => {
                    const newT = [...defaultTrajectory];
                    newT.forEach(t => { if(t.isOuting) t.mood = ['开心','激动','好奇'][Math.floor(Math.random()*3)]; });
                    setTrajectory(newT);
                    playMagic();
                };

                if (!apiKey) { fallback(); return; }
                setIsGeneratingTrajectory(true);
                try {
                    const today = new Date().toLocaleDateString('zh-CN');
                    const prompt = `请为“福瑞大王”生成一份**今天已经完成的**武汉足迹。今天是：${today}。要求：1.生成5个递增时间点。2.区分外出和在家。3.生动细节action。4.感想thought。5.返回JSON数组: id, time, location, action, mood, icon, isOuting (bool), thought。`;
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },

                                <button onClick={() => { playClick(); setShopTab('food') }} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${shopTab === 'food' ? 'bg-white text-orange-500 shadow' : 'text-gray-400'}`}>食品/娱乐</button>
                            </div>

                            {shopTab === 'clothes' ? (
                                <div className="grid grid-cols-3 gap-3">
                                    {[
                                        { id: 'none', icon: '🚫', label: '原皮', price: 0, type: 'clothes' },
                                        { id: 'chefhat', icon: '👨‍🍳', label: '大厨', price: 10, type: 'clothes' },
                                        { id: 'sunglasses', icon: '🕶️', label: '酷盖', price: 15, type: 'clothes' },
                                        { id: 'bowtie', icon: '🎀', label: '领结', price: 5, type: 'clothes' },
                                        { id: 'flower', icon: '🌸', label: '小花', price: 5, type: 'clothes' },
                                    ].map(item => (
                                        <button key={item.id} onClick={() => { playClick(); buyItem(item) }} className={`flex flex-col items-center justify-center p-3 rounded-2xl border-2 transition-all ${outfit.accessory === item.id ? 'bg-blue-50 border-blue-400 text-blue-600' : 'bg-gray-50 border-transparent text-gray-500 hover:bg-white hover:border-blue-200'}`}>
                                            <span className="text-2xl mb-1">{item.icon}</span>
                                            <span className="text-[10px] font-bold mb-1">{item.label}</span>
                                            <span className="text-[9px] text-orange-500 font-mono">💰{item.price}</span>
                                        </button>
                                    ))}
                                </div>
                            ) : (
                                <div className="grid grid-cols-3 gap-3">
                                    {[
                                        { id: 'noodles', icon: '🍜', label: '热干面', price: 5, type: 'food' },
                                        { id: 'fish', icon: '🐟', label: '小鱼干', price: 3, type: 'food' },
                                        { id: 'ticket', icon: '🎡', label: '游乐园', price: 50, type: 'fun' },
                                    ].map(item => (
                                        <button key={item.id} onClick={() => { playClick(); buyItem(item) }} className="flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-orange-50 hover:bg-white hover:border-orange-200 transition-all">
                                            <span className="text-2xl mb-1">{item.icon}</span>
                                            <span className="text-[10px] font-bold mb-1">{item.label}</span>
                                            <span className="text-[9px] text-orange-500 font-mono">💰{item.price}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                    
                    {/* Fortune Modal */}
                    {showFortune && (
                        <div className="absolute top-24 right-4 z-40 bg-gradient-to-br from-red-500 to-orange-600 text-white shadow-2xl rounded-3xl w-72 animate-in fade-in zoom-in slide-in-from-top-4 duration-500 p-1 overflow-hidden border-4 border-yellow-400/30">
                           <div className="bg-white/10 backdrop-blur-sm p-5 h-full rounded-[1.2rem] flex flex-col items-center text-center relative">
                                <button onClick={() => setShowFortune(false)} className="absolute top-3 right-3 text-white/70 hover:text-white hover:bg-white/20 rounded-full p-1 transition"><Icon name="x" size={18}/></button>
                                
                                <h3 className="font-bold text-xl mb-4 flex items-center gap-2 text-yellow-100"><Icon name="sparkles" size={20}/> 虎虎灵签</h3>
                                
                                {isGeneratingFortune ? (
                                    <div className="py-10 flex flex-col items-center gap-3">
                                        <Icon name="loader" size={36} className="animate-spin text-yellow-300"/>
                                        <span className="text-sm text-yellow-100 animate-pulse">大王正在求签...</span>
                                    </div>
                                ) : fortuneData ? (
                                    <div className="space-y-4 animate-in zoom-in duration-500">
                                        <div className="text-6xl font-bold text-yellow-300 drop-shadow-md my-2 font-serif">{fortuneData.level}</div>
                                        
                                        <div className="bg-white/20 rounded-xl p-3 w-full">
                                            <div className="text-xs text-red-100 mb-1 uppercase tracking-wider">今日幸运物</div>
                                            <div className="font-bold text-lg">{fortuneData.item}</div>
                                        </div>
                                        
                                        <div className="bg-white/20 rounded-xl p-3 w-full">
                                            <div className="text-xs text-red-100 mb-1 uppercase tracking-wider">大王寄语</div>
                                            <div className="text-sm leading-relaxed italic">“{fortuneData.advice}”</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="py-8 text-sm">似乎网络不太好，再试一次？</div>
                                )}
                           </div>
                        </div>
                    )}

                    {showImageModal && viewingImage && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/70 backdrop-blur-md animate-in fade-in duration-300" onClick={() => setShowImageModal(false)}>
                            <div className="bg-white rounded-[2rem] p-3 max-w-sm w-full shadow-2xl transform transition-all scale-100 rotate-1 hover:rotate-0 duration-500" onClick={e => e.stopPropagation()}>
                                <div className="relative overflow-hidden rounded-3xl group">
                                    <img src={viewingImage} className="w-full aspect-square object-cover transform group-hover:scale-105 transition-transform duration-700" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                                        <p className="text-white text-sm font-bold">📍 {modalTitle}</p>
                                    </div>
                                    <button onClick={() => { playClick(); setShowImageModal(false); }} className="absolute top-3 right-3 bg-white/90 text-gray-800 rounded-full p-2 shadow-lg hover:scale-110 transition"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="p-6 text-center relative">
                                    <div className="absolute -top-6 left-1/2 -translate-x-1/2 bg-orange-500 text-white px-4 py-1 rounded-full text-xs font-bold shadow-md tracking-wide">明信片</div>
                                    <p className="text-gray-700 text-base font-medium leading-relaxed italic">“ {modalThought} ”</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
