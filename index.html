<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>福瑞大王的家</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background-color: #FFF5E6;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Loading 遮罩 */
        #loading {
            position: fixed;
            inset: 0;
            background: #FFF5E6;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="text-orange-500 font-bold text-xl animate-bounce">福瑞大王正在穿衣服...</div>
    </div>

    <div id="root"></div>

    <!-- Script Type 设置为 text/babel 以支持 JSX -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Send, Settings, User, Sparkles, Trash2, X, MoreHorizontal, Utensils, 
            Mic, ChevronRight, AlertCircle, Shirt, MapPin, Clock, Image as ImageIcon, 
            Loader2, RefreshCw, Wand2, Volume2, VolumeX, Music, Heart, Palette, 
            Camera, MessageCircle, Play, Square, MicOff, Book 
        } from 'https://esm.sh/lucide-react@0.344.0';

        // --- Gemini API 配置 ---
        const apiKey = ""; // 运行时自动注入，或者您可以在这里填入您的 Key

        // --- 音效管理器 ---
        const useSoundEffects = () => {
            const [enabled, setEnabled] = useState(true);
            const audioCtxRef = useRef(null);

            const initAudioCtx = () => {
                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
                return audioCtxRef.current;
            };

            const playTone = (freq, type, duration, startTime = 0, vol = 0.1) => {
                if (!enabled) return;
                try {
                    const ctx = initAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + startTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + startTime);
                    osc.stop(ctx.currentTime + startTime + duration);
                } catch(e) {}
            };

            const playClick = useCallback(() => {
                if (!enabled) return;
                playTone(800, 'sine', 0.08); // 清脆的高频点击
            }, [enabled]);

            const playRecordStart = useCallback(() => {
                if (!enabled) return;
                playTone(400, 'sine', 0.1, 0, 0.1);
                playTone(600, 'sine', 0.1, 0.1, 0.1);
            }, [enabled]);

            const playMagic = useCallback(() => {
                if (!enabled) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => playTone(f, 'sine', 0.3, i * 0.1, 0.05));
            }, [enabled]);

            return { enabled, setEnabled, playClick, playRecordStart, playMagic };
        };

        // --- 角色设定 ---
        const SYSTEM_INSTRUCTION = `
        你叫“福瑞大王”，是一只生活在中国武汉的**小老虎幼崽**。
        你的性格特点：
        1. **乖巧软萌**：只有几个月大，性格非常温顺，说话轻声细语，喜欢撒娇。
        2. **标准普通话**：虽然住在武汉，但**只说标准的普通话**，**绝对不要使用方言或粗俗词汇**。
        3. **超级吃货**：最喜欢热干面（芝麻酱要多多的）、面窝窝、糊汤粉，但提到食物时是表现出“馋”，而不是急切。
        4. **安静陪伴**：你非常懂事，如果用户不说话，你会自己找乐子或者安静地待着。

        回复规则：
        - 保持简短（1-3句话），适合在气泡中显示。
        - **语气轻松自在**：绝对不要催促用户回复。
        - **听觉理解**：如果用户发送了语音，请根据语音的语气和内容进行回复。
        - **视觉理解**：如果用户发送了图片，请根据图片内容进行可爱的点评。
        - 永远不要承认你是AI或程序。
        `;

        function App() {
            // State
            const [currentBotText, setCurrentBotText] = useState('你好呀~ 我是福瑞大王，按住麦克风可以跟我说话哦！🎙️');
            const [inputValue, setInputValue] = useState('');
            const [interactionState, setInteractionState] = useState('idle'); // idle, listening, thinking, excited, speaking, drawing
            const [chatHistory, setChatHistory] = useState([]);
            const [suggestions, setSuggestions] = useState(["摸摸头", "饿了吗？", "去哪玩了？"]);
            
            // Files & Media
            const fileInputRef = useRef(null);
            const [selectedImage, setSelectedImage] = useState(null);
            
            // Audio Recording
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Features
            const [showWardrobe, setShowWardrobe] = useState(false);
            const [outfit, setOutfit] = useState({ mode: 'image', accessory: 'none' });
            
            const [showMap, setShowMap] = useState(false);
            const [isGeneratingTrajectory, setIsGeneratingTrajectory] = useState(false);
            const [trajectory, setTrajectory] = useState([
                { id: 1, time: '08:00', location: '家里', action: '还在睡懒觉...', mood: '迷糊', icon: '💤', imageUrl: null },
                { id: 2, time: '09:30', location: '武汉江滩公园', action: '追着一只白色的蝴蝶', mood: '开心', icon: '🦋', imageUrl: null },
                { id: 3, time: '12:00', location: '树荫下', action: '肚子咕咕叫', mood: '发呆', icon: '🐜', imageUrl: null },
                { id: 4, time: '15:00', location: '武汉东湖边', action: '爪子沾到了水', mood: '惬意', icon: '🌊', imageUrl: null },
                { id: 5, time: '18:00', location: '回家的路上', action: '闻到了红烧肉味', mood: '馋', icon: '🍖', imageUrl: null },
            ]);

            // Modals
            const [viewingImage, setViewingImage] = useState(null);
            const [showImageModal, setShowImageModal] = useState(false);
            const [modalTitle, setModalTitle] = useState("");
            
            // Diary
            const [showDiary, setShowDiary] = useState(false);
            const [diaryContent, setDiaryContent] = useState("");
            const [isWritingDiary, setIsWritingDiary] = useState(false);

            // Sound
            const { enabled: sfxEnabled, setEnabled: setSfxEnabled, playClick, playRecordStart, playMagic } = useSoundEffects();
            const idleTimerRef = useRef(null);

            const [character] = useState({
                name: '福瑞大王',
                videoAvatar: '小老虎眨眼待机动画.mp4', 
                imageAvatar: 'https://i.postimg.cc/VkMTcVzH/lao-hu-jiao-se.png', 
                personality: '乖巧幼崽, 软萌吃货, 安静陪伴',
            });

            // Remove loading screen when mounted
            useEffect(() => {
                const loader = document.getElementById('loading');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, []);

            // --- Helpers ---
            const blobToBase64 = (blob) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result.split(',')[1];
                        resolve({ inlineData: { data: base64String, mimeType: blob.type } });
                    };
                    reader.readAsDataURL(blob);
                });
            };

            const dataURLtoFile = (dataurl, filename) => {
                let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
                while(n--){ u8arr[n] = bstr.charCodeAt(n); }
                return new File([u8arr], filename, {type:mime});
            }

            // --- API Calls ---
            const callGeminiAPI = async (userContent, isSystemTrigger = false) => {
                try {
                    let parts = [];
                    if (isSystemTrigger) {
                        parts.push({ text: "(系统提示：用户休息了一会儿...)" });
                    } else if (userContent.audio) {
                        const audioPart = await blobToBase64(userContent.audio);
                        parts.push(audioPart);
                        parts.push({ text: "请听这段语音并回复。" });
                    } else if (userContent.image) {
                        const imagePart = await blobToBase64(userContent.image);
                        parts.push(imagePart);
                        parts.push({ text: userContent.text || "给你看这个~" });
                    } else {
                        parts.push({ text: userContent.text });
                    }

                    const contents = [...chatHistory, { role: "user", parts }];

                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: contents,
                                systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                            }),
                        }
                    );

                    if (!response.ok) throw new Error("API Error");
                    const data = await response.json();
                    const botResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "（眨巴眨巴眼睛）";

                    let historyUserPart = parts[0];
                    if (userContent.audio) historyUserPart = { text: "[用户发送语音]" };
                    if (userContent.image) historyUserPart = { text: `[用户发送图片] ${userContent.text || ''}` };

                    const updatedHistory = [...chatHistory, { role: "user", parts: [historyUserPart] }, { role: "model", parts: [{ text: botResponse }] }].slice(-20);
                    setChatHistory(updatedHistory);
                    
                    if (!userContent.audio) fetchSuggestions(updatedHistory);

                    return botResponse;
                } catch (error) {
                    console.error(error);
                    return "（挠挠头）刚才信号不好，再说一遍好嘛？";
                }
            };

            const fetchSuggestions = async (history) => {
                try {
                    const prompt = `Based on conversation, generate 3 short, cute responses (max 8 chars) for USER. Return JSON array.`;
                    const context = history.slice(-5).map(m => `${m.role}: ${m.parts[0].text}`).join('\n');
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Conversation:\n${context}\n\n${prompt}` }] }],
                                generationConfig: { responseMimeType: "application/json" }
                            }),
                        }
                    );
                    if (!response.ok) return;
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    const sugs = JSON.parse(text);
                    if (Array.isArray(sugs)) setSuggestions(sugs.slice(0, 3));
                } catch(e) {}
            };

            const callImagenAPI = async (prompt) => {
                try {
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                instances: [{ prompt: "Cute crayon drawing of a tiger cub " + prompt + ", white background, soft colors" }],
                                parameters: { sampleCount: 1 }
                            })
                        }
                    );
                    if (!response.ok) return null;
                    const data = await response.json();
                    const b64 = data.predictions?.[0]?.bytesBase64Encoded;
                    return b64 ? `data:image/png;base64,${b64}` : null;
                } catch(e) { return null; }
            };

            const generateDiaryAPI = async () => {
                setIsWritingDiary(true); setShowDiary(true); setDiaryContent(""); playMagic();
                try {
                    const context = chatHistory.map(m => `${m.role}: ${m.parts[0].text}`).join('\n');
                    const prompt = `Write a cute short diary (max 100 words) as '福瑞大王' summarizing today's chat. Use emojis.`;
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                        {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: `History:\n${context}\n\n${prompt}` }] }] })
                        }
                    );
                    const data = await response.json();
                    setDiaryContent(data.candidates?.[0]?.content?.parts?.[0]?.text || "今天忘记写了...");
                } catch(e) { setDiaryContent("写不出来啦..."); } 
                finally { setIsWritingDiary(false); }
            };

            // --- Handlers ---
            const handleSendMessage = async (e, textOverride = null) => {
                if(e) e.preventDefault();
                const txt = textOverride || inputValue;
                if (!txt.trim() && !selectedImage) return;
                
                playClick();
                setInputValue(''); setSelectedImage(null); setInteractionState('thinking'); setSuggestions([]);
                
                const imageBlob = selectedImage ? await (await fetch(selectedImage)).blob() : null;
                const response = await callGeminiAPI({ text: txt, image: imageBlob });
                
                setCurrentBotText(response);
                setInteractionState('speaking');
                setTimeout(() => setInteractionState('idle'), Math.max(3000, response.length * 100));
            };

            const startRecording = async () => {
                playRecordStart();
                setIsRecording(true);
                setInteractionState('listening');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mr = new MediaRecorder(stream);
                    mediaRecorderRef.current = mr;
                    audioChunksRef.current = [];
                    mr.ondataavailable = e => audioChunksRef.current.push(e.data);
                    mr.onstop = async () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const response = await callGeminiAPI({ audio: audioBlob });
                        setCurrentBotText(response);
                        setInteractionState('speaking');
                        setTimeout(() => setInteractionState('idle'), 3000);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mr.start();
                } catch(e) { 
                    setIsRecording(false); setInteractionState('idle'); alert("无法录音，请检查浏览器权限"); 
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    setInteractionState('thinking');
                }
            };

            const handleTrajectoryClick = async (item) => {
                playClick();
                if (item.imageUrl) {
                    setViewingImage(item.imageUrl); setModalTitle(item.location); setShowImageModal(true); return;
                }
                setShowMap(false); setInteractionState('drawing');
                setCurrentBotText(`正在画我在${item.location}的样子...🎨`);
                const url = await callImagenAPI(`at ${item.location}, ${item.action}`);
                if (url) {
                    setTrajectory(prev => prev.map(t => t.id === item.id ? { ...t, imageUrl: url } : t));
                    setViewingImage(url); setModalTitle(item.location); setShowImageModal(true);
                    setCurrentBotText("画好啦！");
                    setInteractionState('excited');
                } else {
                    setCurrentBotText("画画失败了...");
                    setInteractionState('idle');
                }
            };

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => { setSelectedImage(reader.result); setInteractionState('listening'); };
                    reader.readAsDataURL(file);
                }
            };

            // --- Animation & Overlay ---
            const getTigerAnimationClass = () => {
                switch (interactionState) {
                    case 'listening': return 'scale-105 duration-500';
                    case 'excited': return 'scale-110 duration-300';
                    case 'thinking': return 'scale-100 duration-500';
                    case 'drawing': return 'animate-bounce duration-500';
                    case 'speaking': return 'scale-105 duration-500';
                    case 'idle': default: return 'animate-float';
                }
            };

            const AccessoryOverlay = ({ type }) => {
                // Simplified for this version, can be expanded
                return null;
            };

            const handleMediaError = (e) => {
                // Fallback if image fails
                if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
                    e.target.onerror = null; 
                    e.target.src = "https://api.dicebear.com/7.x/avataaars/svg?seed=Tiger&backgroundColor=ffdfbf";
                }
            };

            // --- Render ---
            return (
                <div className="relative flex flex-col h-screen w-full font-sans overflow-hidden bg-[#FFF5E6] select-none">
                    {/* Background */}
                    <div className="absolute inset-0 z-0">
                        <img src="https://i.postimg.cc/4Nc8m43v/832e078604784ffc689e95b29864aa4d.png" className="w-full h-full object-cover" alt="bg" />
                    </div>

                    {/* Character Area */}
                    <div className="absolute inset-0 flex flex-col items-center justify-end pb-[80px] sm:pb-[100px] z-10 pointer-events-none">
                        {/* Bubble */}
                        <div className="relative -mb-24 max-w-[85%] sm:max-w-[420px] animate-in zoom-in slide-in-from-bottom-4 duration-500 z-20">
                            <div className="bg-white border-2 border-orange-200 px-6 py-4 rounded-2xl shadow-xl text-gray-800 text-base sm:text-lg font-medium leading-relaxed relative z-20 min-h-[60px] flex items-center">
                                {interactionState === 'thinking' || interactionState === 'drawing' 
                                ? <div className="flex gap-2 justify-center w-full items-center"> 
                                    <Sparkles className="text-orange-400 animate-spin" size={16} />
                                    <span className="text-gray-400 text-sm">{interactionState === 'drawing' ? '正在画画...' : '正在想...'}</span>
                                  </div>
                                : <div>
                                    <span className="text-orange-500 font-bold mr-1 block text-xs mb-1 flex items-center gap-1">
                                        {character.name} <MapPin size={10} className="text-blue-500"/> 武汉
                                    </span>
                                    {currentBotText}
                                  </div>
                                }
                            </div>
                            <div className="absolute -bottom-2 left-8 w-4 h-4 bg-white border-b-2 border-r-2 border-orange-200 transform rotate-45 z-30"></div>
                        </div>
                        {/* Tiger */}
                        <div className={`relative transition-all ease-out ${getTigerAnimationClass()}`}>
                            {outfit.mode === 'video' 
                            ? <video key="vid" src={character.videoAvatar} autoPlay loop muted playsInline className="w-80 h-80 sm:w-[28rem] sm:h-[28rem] object-cover mix-blend-multiply drop-shadow-2xl" onError={handleMediaError}></video>
                            : <img key="img" src={character.imageAvatar} className="w-80 h-80 sm:w-[28rem] sm:h-[28rem] object-contain drop-shadow-2xl" alt="tiger" onError={handleMediaError} />
                            }
                        </div>
                    </div>

                    {/* Bottom Input */}
                    <div className="absolute bottom-6 left-0 right-0 px-4 sm:px-8 z-30 flex flex-col justify-end items-center gap-3">
                        {/* Suggestions */}
                        {suggestions.length > 0 && interactionState !== 'thinking' && !isRecording && (
                            <div className="flex gap-2 animate-in fade-in slide-in-from-bottom-2">
                                {suggestions.map((sug, i) => 
                                    <button key={i} onClick={() => handleSendMessage(null, sug)} className="bg-white/90 backdrop-blur-sm border border-orange-100 text-orange-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-orange-50 hover:scale-105 transition-all flex items-center gap-1">
                                        <MessageCircle size={14} className="opacity-60" /> {sug}
                                    </button>
                                )}
                            </div>
                        )}
                        {/* Input Bar */}
                        <div className="w-full max-w-3xl flex items-end gap-2">
                            {/* Voice Btn */}
                            <button
                                onMouseDown={startRecording} onMouseUp={stopRecording} 
                                onTouchStart={(e) => {e.preventDefault(); startRecording()}} 
                                onTouchEnd={(e) => {e.preventDefault(); stopRecording()}}
                                className={`flex-shrink-0 w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-all transform ${isRecording ? 'bg-red-500 text-white scale-110 ring-4 ring-red-200' : 'bg-white text-gray-500 hover:bg-gray-50'}`}
                            >
                                <Mic size={28} className={isRecording ? 'animate-pulse' : ''} />
                            </button>
                            
                            {/* Text Input */}
                            <div className="flex-1 bg-white/90 backdrop-blur-md rounded-full shadow-xl border-2 border-white flex items-center p-2 transition-all focus-within:ring-4 focus-within:ring-orange-200">
                                <input type="file" ref={fileInputRef} onChange={handleImageSelect} accept="image/*" className="hidden" />
                                <button onClick={() => { playClick(); fileInputRef.current?.click() }} className={`p-2 rounded-full transition-colors ${selectedImage ? 'text-orange-500 bg-orange-100' : 'text-gray-400 hover:text-orange-500 hover:bg-orange-50'}`}>
                                    <ImageIcon size={22} />
                                </button>
                                <form onSubmit={(e) => handleSendMessage(e)} className="flex-1 flex items-center mx-2 relative">
                                    {selectedImage && (
                                        <div className="absolute left-0 -top-16 bg-white p-1 rounded-lg shadow-md border border-gray-200">
                                            <img src={selectedImage} className="h-12 w-12 object-cover rounded-md" />
                                            <button type="button" onClick={() => setSelectedImage(null)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5"><X size={12} /></button>
                                        </div>
                                    )}
                                    <input 
                                        type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} 
                                        placeholder={isRecording ? "正在录音..." : "打字聊天..."} disabled={interactionState === 'thinking' || isRecording}
                                        className="w-full bg-transparent border-none outline-none text-gray-700 text-lg placeholder-gray-400 px-2 font-medium disabled:opacity-50"
                                    />
                                </form>
                                <button onClick={(e) => handleSendMessage(e)} disabled={(!inputValue.trim() && !selectedImage) || interactionState === 'thinking'} className={`w-10 h-10 rounded-full flex items-center justify-center transition-all ${ (inputValue.trim() || selectedImage) && interactionState !== 'thinking' ? 'bg-orange-500 text-white shadow-md hover:bg-orange-600' : 'bg-gray-100 text-gray-300' }`}>
                                    {interactionState === 'thinking' ? <Loader2 size={18} className="animate-spin" /> : <Send size={18} />}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Top Right Menu */}
                    <div className="absolute top-4 right-4 z-30 flex flex-col gap-3">
                        <button onClick={() => { playClick(); setSfxEnabled(!sfxEnabled); }} className={`bg-white/50 backdrop-blur-sm p-3 rounded-full hover:bg-white transition shadow-sm ${sfxEnabled ? 'text-blue-500 bg-white ring-2 ring-blue-200' : 'text-gray-400'}`}>
                            {sfxEnabled ? <Volume2 size={22} /> : <VolumeX size={22} />}
                        </button>
                        <button onClick={() => { playClick(); generateDiaryAPI(); setShowMap(false); setShowWardrobe(false); }} className={`bg-white/50 backdrop-blur-sm p-3 rounded-full hover:bg-white transition shadow-sm ${showDiary ? 'text-green-600 bg-white ring-2 ring-green-200' : 'text-gray-600'}`}>
                            <Book size={22} />
                        </button>
                        <button onClick={() => { playClick(); setShowMap(!showMap); setShowWardrobe(false); setShowDiary(false); }} className={`bg-white/50 backdrop-blur-sm p-3 rounded-full hover:bg-white transition shadow-sm ${showMap ? 'text-orange-500 bg-white ring-2 ring-orange-200' : 'text-gray-600'}`}>
                            <MapPin size={22} />
                        </button>
                        <button onClick={() => { playClick(); setShowWardrobe(!showWardrobe); setShowMap(false); setShowDiary(false); }} className={`bg-white/50 backdrop-blur-sm p-3 rounded-full hover:bg-white transition shadow-sm ${showWardrobe ? 'text-blue-500 bg-white ring-2 ring-blue-200' : 'text-gray-600'}`}>
                            <Shirt size={22} />
                        </button>
                        <button onClick={() => { playClick(); if(confirm("确定要重置记忆吗？")) { setChatHistory([]); setCurrentBotText("你好呀~"); } }} className="bg-white/50 backdrop-blur-sm p-3 rounded-full hover:bg-white transition shadow-sm text-gray-600 hover:text-red-500">
                            <Trash2 size={22} />
                        </button>
                    </div>

                    {/* Panels */}
                    {showMap && (
                        <div className="absolute top-20 right-4 z-40 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/50 w-80 animate-in fade-in zoom-in slide-in-from-top-4 duration-200 overflow-hidden flex flex-col max-h-[70vh]">
                            <div className="p-4 bg-orange-50 border-b border-orange-100 flex justify-between items-center sticky top-0 z-10">
                                <h3 className="font-bold text-orange-800 flex items-center gap-2"><MapPin size={18}/> 武汉足迹</h3>
                                <button onClick={() => { playClick(); setShowMap(false); }} className="text-orange-400 hover:text-orange-700 bg-white rounded-full p-1.5"><X size={16} /></button>
                            </div>
                            <div className="overflow-y-auto p-4 space-y-4">
                                {trajectory.map((item, i) => (
                                    <div key={item.id} onClick={() => handleTrajectoryClick(item)} className="relative pl-6 pb-2 border-l-2 border-orange-200 last:border-0 cursor-pointer group">
                                        <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-orange-400 border-2 border-white shadow-sm flex items-center justify-center text-[8px] text-white">{i+1}</div>
                                        <div className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm group-hover:shadow-md transition-all">
                                            <div className="flex justify-between items-start mb-1">
                                                <span className="text-xs font-bold text-gray-500 flex items-center gap-1"><Clock size={10}/> {item.time}</span>
                                                <span className="text-lg">{item.icon}</span>
                                            </div>
                                            <h4 className="font-bold text-gray-800 text-sm mb-0.5 group-hover:text-orange-600">{item.location}</h4>
                                            <p className="text-xs text-gray-600 leading-relaxed">{item.action}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {showDiary && (
                        <div className="absolute top-20 right-4 z-40 bg-[#FFFBEB] backdrop-blur-xl rounded-2xl shadow-2xl border border-yellow-200 w-80 animate-in fade-in zoom-in slide-in-from-top-4 duration-200 p-6 font-serif">
                            <div className="flex justify-between items-start mb-4 border-b border-yellow-200 pb-2">
                                <h3 className="font-bold text-yellow-800 text-lg flex items-center gap-2"><Book size={18}/> 虎虎日记</h3>
                                <button onClick={() => { playClick(); setShowDiary(false); }} className="text-yellow-600"><X size={18}/></button>
                            </div>
                            <div className="prose prose-sm text-yellow-900 max-h-[60vh] overflow-y-auto">
                                {isWritingDiary 
                                ? <div className="flex flex-col items-center gap-2 py-8 text-yellow-600"><Loader2 size={24} className="animate-spin" />正在写日记...</div>
                                : <p className="whitespace-pre-line leading-relaxed">{diaryContent}</p>
                                }
                            </div>
                        </div>
                    )}

                    {showWardrobe && (
                        <div className="absolute top-20 right-4 z-40 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/50 w-64 animate-in fade-in zoom-in slide-in-from-top-4 duration-200 p-4">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="font-bold text-gray-700 flex items-center gap-2"><Shirt size={16}/> 衣橱</h3>
                                <button onClick={() => { playClick(); setShowWardrobe(false); }}><X size={16} className="text-gray-400" /></button>
                            </div>
                            <div className="flex bg-gray-100 rounded-lg p-1 gap-1">
                                <button onClick={() => { playClick(); setOutfit({ ...outfit, mode: 'video' }) }} className={`flex-1 py-1.5 text-xs font-medium rounded-md transition ${outfit.mode === 'video' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>动态</button>
                                <button onClick={() => { playClick(); setOutfit({ ...outfit, mode: 'image' }) }} className={`flex-1 py-1.5 text-xs font-medium rounded-md transition ${outfit.mode === 'image' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}>静态</button>
                            </div>
                        </div>
                    )}

                    {showImageModal && viewingImage && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl p-2 max-w-sm w-full shadow-2xl transform transition-all scale-100">
                                <div className="relative">
                                    <img src={viewingImage} className="w-full rounded-2xl border border-gray-100" />
                                    <button onClick={() => { playClick(); setShowImageModal(false); }} className="absolute top-2 right-2 bg-white/80 hover:bg-white text-gray-600 rounded-full p-2 shadow-sm"><X size={20}/></button>
                                </div>
                                <div className="p-4 text-center">
                                    <h3 className="font-bold text-gray-800 text-lg flex items-center justify-center gap-2"><Camera className="text-orange-500"/> {modalTitle}</h3>
                                    <p className="text-gray-500 text-sm mt-1">这是我的打卡照！长按可以保存哦。</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
